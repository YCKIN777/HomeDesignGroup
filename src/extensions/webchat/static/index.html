<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>家装AI智能体对话</title>
    <style>
        body{max-width:800px;margin:20px auto;font-family:system-ui}
        #msgBox{border:1px solid #ccc;height:500px;overflow-y:auto;padding:10px;margin-bottom:10px}
        .msg{margin:8px 0}
        .user{text-align:right;color:#2266cc}
        .ai{text-align:left;color:#222}
        .input-area{display:flex;gap:8px}
        #inputMsg{flex:1;padding:6px}
        button{padding:6px 12px;cursor:pointer}
    </style>
</head>
<body>
    <h3>家装AI智能体对话</h3>
    <div id="msgBox"></div>
    <div class="input-area">
        <input id="inputMsg" placeholder="输入消息..." />
        <button onclick="sendMsg()">发送</button>
    </div>

<script>
function appendMsg(text, isUser=false){
    const box = document.getElementById("msgBox");
    const div = document.createElement("div");
    div.className = isUser ? "msg user" : "msg ai";
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

async function sendMsg(){
    const input = document.getElementById("inputMsg");
    const msg = input.value.trim();
    if(!msg) return;
    appendMsg(msg, true);
    input.value = "";

    const res = await fetch("/ext-webchat/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            user_msg: msg,
            session_id:"test001"
        })
    });
    const data = await res.json();
    appendMsg(data.reply);
}
</script>
</body>
</html>
