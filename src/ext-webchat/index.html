<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>家装AI咨询</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#f5f7fa;max-width:900px;margin:20px auto;padding:0 12px}
        .chat-box{background:#fff;border-radius:12px;box-shadow:0 2px 10px #00000014;overflow:hidden}
        .header{background:#2563eb;color:#fff;padding:14px;text-align:center;font-size:18px;display:flex;justify-content:space-between;align-items:center}
        #clearBtn{background:#fff;color:#2563eb;border:1px solid #fff;border-radius:6px;padding:4px 8px;cursor:pointer;font-size:13px}
        #chat{height:520px;overflow-y:auto;padding:16px}
        .msg{margin:8px 0;display:flex}
        .user{justify-content:flex-end}
        .user .bubble{background:#2563eb;color:#fff;border-radius:12px 12px 2px 12px}
        .ai .bubble{background:#eef2ff;color:#111;border-radius:12px 12px 12px 2px;white-space:pre-wrap}
        .bubble{max-width:75%;padding:10px 14px}
        .input-area{display:flex;padding:12px;border-top:1px solid #eee}
        #msg-input{flex:1;border:1px solid #ddd;padding:10px;border-radius:8px;outline:none;font-size:16px}
        #send{margin-left:10px;padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}
    </style>
</head>
<body>
<div class="chat-box">
    <div class="header">
        壹城精工 · 家装AI咨询
        <button id="clearBtn">清空对话</button>
    </div>
    <div id="chat"></div>
    <div class="input-area">
        <input id="msg-input" placeholder="请输入家装问题..." />
        <button id="send">发送</button>
    </div>
</div>
<script>
const chatDom = document.getElementById('chat');
const inputDom = document.getElementById('msg-input');
const sendBtn = document.getElementById('send');
const clearBtn = document.getElementById('clearBtn');
const sessionId = "session_001";
const STORAGE_KEY = "home_chat_history";
// 从localStorage加载历史消息
function loadHistory(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    try{
        return JSON.parse(raw);
    }catch(e){
        return [];
    }
}
// 保存消息到localStorage
function saveHistory(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
// 渲染消息列表
function renderAllMessages(msgList){
    chatDom.innerHTML = "";
    msgList.forEach(item=>{
        const bubble = addMsgBlock(item.isUser);
        bubble.innerText = item.text;
    })
}
function addMsgBlock(isUser){
    const div = document.createElement('div');
    div.className = `msg ${isUser?'user':'ai'}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    div.appendChild(bubble);
    chatDom.appendChild(div);
    chatDom.scrollTop = chatDom.scrollHeight;
    return bubble;
}
// 初始化加载历史对话
let messageList = loadHistory();
renderAllMessages(messageList);
async function sendMsg(){
    const text = inputDom.value.trim();
    if(!text) return;
    // 添加用户消息
    messageList.push({isUser:true, text:text});
    saveHistory(messageList);
    addMsgBlock(true).innerText = text;
    inputDom.value = "";
    const aiBubble = addMsgBlock(false);
    aiBubble.innerText = "";
    // ===========修改这里：去掉多余 /ext-webchat 前缀============
    const res = await fetch("/chat-stream",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({user_msg:text, session_id:sessionId})
    })
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let aiFullText = "";
    while(true){
        const {done,value} = await reader.read();
        if(done) break;
        buffer += decoder.decode(value,{stream:true});
        const lines = buffer.split("\n\n");
        buffer = lines.pop();
        for(let line of lines){
            if(line.startsWith("data: ")){
                const data = line.slice(6);
                if(data === "[DONE]") continue;
                aiFullText += data;
                aiBubble.innerText = aiFullText;
                chatDom.scrollTop = chatDom.scrollHeight;
            }
        }
    }
    // AI回复完成，存入本地存储
    messageList.push({isUser:false, text:aiFullText});
    saveHistory(messageList);
}
// 清空对话按钮
clearBtn.onclick = ()=>{
    localStorage.removeItem(STORAGE_KEY);
    messageList = [];
    chatDom.innerHTML = "";
}
sendBtn.onclick = sendMsg;
inputDom.onkeydown = e=>{if(e.key==="Enter") sendMsg()}
</script>
</body>
</html>
